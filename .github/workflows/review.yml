name: DeepSeek PR Review

on:
  # Manual-only pilot: adding this file will not automatically run the review.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: deepseek-review-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    name: dsh-github-review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Validate review input
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Pull request number must be a positive integer."
            exit 1
          fi
          echo "Validated target PR #$PR_NUMBER"

      - name: Verify DeepSeek API key is available
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [[ -z "${DEEPSEEK_API_KEY:-}" ]]; then
            echo "::error::DEEPSEEK_API_KEY is empty or unavailable to this workflow."
            exit 1
          fi
          echo "DEEPSEEK_API_KEY is available (value hidden)."

      - name: Review pull request with DeepSeek
        uses: PerryLink/dsh-github@8b21cfe99478a10bd69e0a1717711663e27e3e7e
        # The composite action's action-patch.mjs reads INPUT_* variables.
        # Composite-action inputs are not automatically exported to nested run
        # steps, so explicitly forward the values it consumes.
        env:
          INPUT_TASK: review
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_OWNER_REPO: ${{ github.repository }}
          INPUT_MODEL: deepseek-v4-pro
          INPUT_ENGINE: model
          INPUT_CHECK_NAME: dsh-github-review
          INPUT_BLOCKING: "true"
          INPUT_FAIL_ON: error
          INPUT_LABEL_FILTERS: ""
          INPUT_PATH_FILTERS: ""
          INPUT_MAX_DIFF_CHARS: "8000"
          INPUT_POST_COMMENTS: "true"
          INPUT_POST_CHECK: "true"
          INPUT_REQUEST_TIMEOUT_MS: "30000"
          INPUT_OUTPUT_DIR: ${{ runner.temp }}/dsh-github
          INPUT_TASK_PROMPT: ""
        with:
          task: review
          pr: ${{ inputs.pr_number }}
          owner-repo: ${{ github.repository }}
          model: deepseek-v4-pro
          engine: model
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          github-token: ${{ github.token }}
          check-name: dsh-github-review
          blocking: "true"
          fail-on: error
          post-comments: "true"
          post-check: "true"
          dsh-version: "0.2.1-rc.2"
          plugin-version: "0.7.16"

      - name: Show redacted dsh error log
        if: always()
        shell: bash
        env:
          DSH_STDERR_PATH: ${{ runner.temp }}/dsh-github/dsh-github-stderr.log
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSH_GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const path = process.env.DSH_STDERR_PATH;
          if (!fs.existsSync(path)) {
            console.log('No dsh stderr log was created.');
            process.exit(0);
          }

          let output = fs.readFileSync(path, 'utf8');
          for (const secret of [
            process.env.DEEPSEEK_API_KEY,
            process.env.DSH_GITHUB_TOKEN,
          ]) {
            if (secret) output = output.split(secret).join('[REDACTED]');
          }

          const lines = output.trimEnd().split('\n');
          console.log('Showing the last 120 lines of dsh stderr (secrets redacted):');
          console.log(lines.slice(-120).join('\n') || '(stderr log is empty)');
          NODE
