name: DeepSeek PR Review

on:
  # Handmatig starten: Actions -> DeepSeek PR Review -> Run workflow -> PR-nummer invullen
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: number

concurrency:
  group: deepseek-review-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    name: dsh-github-review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Validate review input
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Pull request number must be a positive integer."
            exit 1
          fi
          echo "Validated target PR #$PR_NUMBER"

      - name: Verify DeepSeek API key is available
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [[ -z "${DEEPSEEK_API_KEY:-}" ]]; then
            echo "::error::DEEPSEEK_API_KEY is empty or unavailable to this workflow."
            exit 1
          fi
          echo "DEEPSEEK_API_KEY is available (value hidden)."

      # Commit 8b21cfe = release v0.7.25 van dsh-github.
      #
      # Het env-blok hieronder is NODIG: de scripts in deze action lezen hun
      # instellingen uit INPUT_* variabelen, en die komen in een composite action
      # niet vanzelf door naar de interne stappen. Houd env en with gelijk.
      #
      # Wijzigingen t.o.v. de vorige versie:
      #  - plugin-version 0.7.25 (was 0.7.16) -> past nu bij de gepinde action-commit
      #  - dsh-version weggehaald (was release-candidate 0.2.1-rc.2) -> standaard 'latest'
      #  - model deepseek-flash (standaard van de action; was deepseek-v4-pro).
      #    Werkt het? Dan kun je een ander model proberen; zet het dan in BEIDE plekken.
      - name: Review pull request with DeepSeek
        uses: PerryLink/dsh-github@8b21cfe99478a10bd69e0a1717711663e27e3e7e # v0.7.25
        env:
          INPUT_TASK: review
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_OWNER_REPO: ${{ github.repository }}
          INPUT_MODEL: deepseek-flash
          INPUT_ENGINE: model
          INPUT_CHECK_NAME: dsh-github-review
          INPUT_BLOCKING: "true"
          INPUT_FAIL_ON: error
          INPUT_LABEL_FILTERS: ""
          INPUT_PATH_FILTERS: ""
          INPUT_MAX_DIFF_CHARS: "8000"
          INPUT_POST_COMMENTS: "true"
          INPUT_POST_CHECK: "true"
          INPUT_REQUEST_TIMEOUT_MS: "30000"
          INPUT_OUTPUT_DIR: ${{ runner.temp }}/dsh-github
          INPUT_TASK_PROMPT: ""
        with:
          task: review
          pr: ${{ inputs.pr_number }}
          owner-repo: ${{ github.repository }}
          model: deepseek-flash
          engine: model
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          github-token: ${{ github.token }}
          check-name: dsh-github-review
          blocking: "true"
          fail-on: error
          post-comments: "true"
          post-check: "true"
          plugin-version: "0.7.25"

      - name: Show redacted dsh logs
        if: always()
        shell: bash
        env:
          DSH_OUT_DIR: ${{ runner.temp }}/dsh-github
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSH_GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const dir = process.env.DSH_OUT_DIR;
          if (!fs.existsSync(dir)) {
            console.log(`Output directory ${dir} does not exist.`);
            process.exit(0);
          }

          console.log('Files in output directory:');
          for (const f of fs.readdirSync(dir)) console.log('  - ' + f);

          // Toon exit-code, stdout en stderr van dsh, met secrets weggepoetst
          for (const f of fs.readdirSync(dir).filter((n) => n.endsWith('.log') || n.endsWith('exit.txt'))) {
            let output = fs.readFileSync(path.join(dir, f), 'utf8');
            for (const secret of [process.env.DEEPSEEK_API_KEY, process.env.DSH_GITHUB_TOKEN]) {
              if (secret) output = output.split(secret).join('[REDACTED]');
            }
            const lines = output.trimEnd().split('\n');
            console.log(`\n===== ${f} (last 120 lines, secrets redacted) =====`);
            console.log(lines.slice(-120).join('\n') || '(empty)');
          }
          NODE
