name: AI PR Review

# Reviewt elke pull request eerst met DeepSeek en daarna met Qwen als tweede reviewer.
# Qwen krijgt de bevindingen van DeepSeek mee en zoekt juist wat DeepSeek miste.
# Grote PR's worden in delen beoordeeld, zodat elk bestand gezien wordt. Lukt dat niet
# (te groot, timeout), dan heet de review "gedeeltelijk beoordeeld" en NIET "goedgekeurd".
# Elk model zet één comment op de PR en werkt die bij bij nieuwe commits.
# Rood = een model vraagt om wijzigingen.
#
# Instellingen (Settings -> Secrets and variables -> Actions):
#   Secrets:   DEEPSEEK_API_KEY (verplicht), QWEN_API_KEY (optioneel; zonder wordt Qwen overgeslagen)
#   Variables: DEEPSEEK_MODEL (standaard deepseek-v4-pro)
#              QWEN_MODEL     (standaard qwen-plus)
#              QWEN_BASE_URL  (standaard https://dashscope-intl.aliyuncs.com/compatible-mode/v1)
#              REVIEW_MAX_CHUNKS (standaard 15) - max. aantal delen per review; meer = gedeeltelijk
#              AI_FIX_MAX_ROUNDS (standaard 3) - hoe vaak Claude zelf mag fixen per PR
#              NOTIFY_USER    (standaard: eigenaar van de repo) - wie de "klaar"-melding krijgt
#
# Automatische fix-loop (job "Claude fix"):
#   Vraagt DeepSeek of Qwen om wijzigingen, dan leest Claude de bevindingen, past de code aan
#   en pusht een commit met "[ai-fix]". Die push start deze workflow opnieuw, tot alles groen is
#   of het maximum aantal rondes is bereikt. Nodig: de Claude GitHub App op deze repo en het
#   secret CLAUDE_CODE_OAUTH_TOKEN (Claude-abonnement, via `claude setup-token`).
#   Pauzeren voor één PR: zet het label "no-ai-fix" op die PR.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: number

concurrency:
  group: ai-review-${{ inputs.pr_number || github.event.pull_request.number }}
  # false: een nieuwe run wacht tot de vorige klaar is, zodat Claude's push niet zijn eigen job afbreekt
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}

jobs:
  deepseek:
    name: DeepSeek review
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      status: ${{ steps.review.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Review with DeepSeek
        id: review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_NAME: DeepSeek
          AI_BASE_URL: https://api.deepseek.com
          AI_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-pro' }}
          AI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MAX_CHUNKS: ${{ vars.REVIEW_MAX_CHUNKS || '15' }}
          REVIEW_OUTPUT: deepseek-review.json
        run: node .github/scripts/ai-review.mjs

      - name: Save review result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-review
          path: deepseek-review.json
          if-no-files-found: ignore

  qwen:
    name: Qwen review
    needs: deepseek
    # Draait alleen als de DeepSeek-review gelukt is (dus ook niet op draft-PR's, die DeepSeek overslaat).
    if: needs.deepseek.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ran: ${{ steps.key.outputs.present }}
      status: ${{ steps.review.outputs.status }}
    steps:
      - name: Check for Qwen key
        id: key
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
        run: |
          if [ -n "$QWEN_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "QWEN_API_KEY is not set - skipping the Qwen review."
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22

      - name: Get DeepSeek's findings
        if: steps.key.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: deepseek-review
          path: previous
        continue-on-error: true

      - name: Review with Qwen (second reviewer)
        id: review
        if: steps.key.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_NAME: Qwen
          AI_ROLE: second
          PREVIOUS_REVIEW: previous/deepseek-review.json
          AI_BASE_URL: ${{ vars.QWEN_BASE_URL || 'https://dashscope-intl.aliyuncs.com/compatible-mode/v1' }}
          AI_MODEL: ${{ vars.QWEN_MODEL || 'qwen-plus' }}
          AI_API_KEY: ${{ secrets.QWEN_API_KEY }}
          MAX_CHUNKS: ${{ vars.REVIEW_MAX_CHUNKS || '15' }}
          REVIEW_OUTPUT: qwen-review.json
        run: node .github/scripts/ai-review.mjs

      - name: Save review result
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qwen-review
          path: qwen-review.json
          if-no-files-found: ignore

  # Vraagt een reviewer om wijzigingen? Dan beoordeelt Claude de bevindingen:
  # terechte punten lost hij op (één commit), onterechte legt hij uit in een PR-comment.
  autofix:
    name: Claude fix
    needs: [deepseek, qwen]
    if: >-
      always()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !contains(github.event.pull_request.labels.*.name, 'no-ai-fix')
      && (needs.deepseek.outputs.status == 'request_changes' || needs.qwen.outputs.status == 'request_changes')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Download review results
        uses: actions/download-artifact@v4
        with:
          path: reviews
          merge-multiple: true
        continue-on-error: true

      - name: Collect findings and check the round limit
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAX_ROUNDS: ${{ vars.AI_FIX_MAX_ROUNDS || '3' }}
          NOTIFY: ${{ vars.NOTIFY_USER || github.repository_owner }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const files = fs.existsSync('reviews') ? fs.readdirSync('reviews').filter((f) => f.endsWith('.json')) : []
          const asking = files
            .map((f) => JSON.parse(fs.readFileSync('reviews/' + f, 'utf8')))
            .filter((r) => r.verdict === 'request_changes')
          let text = ''
          for (const r of asking) {
            text += `## ${r.reviewer} (${r.model})\n`
            for (const f of r.findings) {
              text += `- [${f.severity}] ${f.path}${f.line ? ':' + f.line : ''} - ${f.title}: ${f.detail}\n`
            }
            text += '\n'
          }
          fs.writeFileSync(process.env.RUNNER_TEMP + '/findings.md', text)
          NODE

          if ! grep -q . "$RUNNER_TEMP/findings.md"; then
            echo "::warning::Review job failed without a request_changes verdict (crash or API error) - not starting Claude."
            exit 0
          fi

          rounds=$(gh api "repos/$REPO/pulls/$PR_NUMBER/commits" --paginate \
            --jq '[.[] | select(.commit.message | contains("[ai-fix]"))] | length' | awk '{s+=$1} END {print s+0}')
          echo "AI fix rounds so far: $rounds / $MAX_ROUNDS"
          if [ "$rounds" -ge "$MAX_ROUNDS" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "⚠️ @$NOTIFY Claude heeft al $rounds keer geprobeerd de review-opmerkingen op te lossen, maar DeepSeek/Qwen zijn nog niet tevreden. Kijk jij even mee? (De automatische fix-loop stopt hier.)"
            exit 0
          fi
          echo "run_claude=true" >> "$GITHUB_OUTPUT"
          echo "round=$((rounds + 1))" >> "$GITHUB_OUTPUT"
          {
            echo 'findings<<__FINDINGS_EOF__'
            cat "$RUNNER_TEMP/findings.md"
            echo '__FINDINGS_EOF__'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.plan.outputs.run_claude == 'true'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Let Claude handle the review findings
        if: steps.plan.outputs.run_claude == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Geen github_token meegeven: dan pusht Claude als de Claude GitHub App,
          # en alleen dan start de review-workflow opnieuw op zijn commit.
          # Neemt CLAUDE_CODE_OAUTH_TOKEN, of anders het token dat onder ANTHROPIC_API_KEY staat.
          # In beide gevallen moet het het abonnementstoken uit `claude setup-token` zijn (sk-ant-oat...).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.ANTHROPIC_API_KEY }}
          allowed_bots: "claude[bot]"
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(node --check:*),Bash(dotnet build:*),Bash(dotnet test:*),Bash(npm ci:*),Bash(npm run lint:*),Bash(npm test:*)"
          prompt: |
            Je werkt in de repository ${{ github.repository }}, op de branch `${{ github.event.pull_request.head.ref }}`
            van pull request #${{ env.PR_NUMBER }}. Dit is automatische fix-ronde ${{ steps.plan.outputs.round }}.

            Een AI-reviewer heeft om wijzigingen gevraagd. Dit zijn de bevindingen:

            ${{ steps.plan.outputs.findings }}

            Opdracht:
            1. Controleer elke blocker- en major-bevinding in de echte code. AI-reviewers hebben het
               niet altijd bij het rechte eind.
            2. Terechte bevindingen: los ze op. Minor/nit alleen als het klein en veilig is.
               Verander niets wat niet met deze bevindingen te maken heeft.
            3. Controleer je werk waar mogelijk: `node --check` voor .mjs-bestanden, `dotnet build` /
               `dotnet test` voor C#, `npm run lint` / `npm test` in agf-frontend voor de frontend.
            4. Heb je code aangepast: maak precies één commit met een message die begint met `fix: `
               en eindigt met ` [ai-fix]`, en push die naar `${{ github.event.pull_request.head.ref }}`.
               Push nooit naar main.
            5. Maak NOOIT een commit zonder codewijziging (geen lege commits, geen `--allow-empty`).
            6. Vind je een bevinding onterecht, of heb je een punt bewust niet aangepast? Schrijf dan per
               punt kort in het Nederlands waarom, met verwijzing naar bestand en regel, in het bestand
               `.ai-fix-note.md` in de root van de repository. Commit dat bestand NIET; de workflow
               plaatst het als comment op de PR, en de reviewers lezen het bij de volgende ronde mee.

      - name: Post Claude's explanation and check what happened
        if: always() && steps.plan.outputs.run_claude == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NOTIFY: ${{ vars.NOTIFY_USER || github.repository_owner }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          OLD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          new_sha=$(gh api "repos/$REPO/branches/$BRANCH" --jq .commit.sha)
          note=".ai-fix-note.md"
          if [ "$new_sha" != "$OLD_SHA" ]; then
            echo "Claude pushed $new_sha - the review runs again on that commit."
            if [ -s "$note" ]; then
              { echo '<!-- ai-fix-note -->'; echo "### 🤖 Claude: toelichting bij fix-ronde"; echo; cat "$note"; } > "$RUNNER_TEMP/body.md"
              gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/body.md"
            fi
          elif [ -s "$note" ]; then
            { echo '<!-- ai-fix-note -->'; echo "### 🤖 Claude: geen codewijziging nodig volgens Claude"; echo; cat "$note"; echo; echo "@$NOTIFY Claude vindt de bevindingen hierboven onterecht en heeft niets aangepast. Beoordeel jij wie gelijk heeft? Na een nieuwe commit lezen de reviewers deze uitleg mee."; } > "$RUNNER_TEMP/body.md"
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "⚠️ @$NOTIFY Claude heeft niets gepusht en geen uitleg gegeven. Kijk even in de log van de job **Claude fix**. (Op een PR die \`.github/workflows/review.yml\` zelf wijzigt is dit normaal: de Claude-action draait dan uit veiligheid niet.)"
          fi

  # Melding voor jou zodra beide reviews klaar zijn (GitHub stuurt die via e-mail / de GitHub-app).
  notify:
    name: Ready to test
    needs: [deepseek, qwen]
    # Bij request_changes eindigt de review met exit 1 (job = failure), dus dan draait deze job niet.
    if: github.event_name == 'pull_request' && needs.deepseek.result == 'success' && needs.qwen.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post "ready to test" comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NOTIFY: ${{ vars.NOTIFY_USER || github.repository_owner }}
          QWEN_RAN: ${{ needs.qwen.outputs.ran }}
          DEEPSEEK_STATUS: ${{ needs.deepseek.outputs.status }}
          QWEN_STATUS: ${{ needs.qwen.outputs.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          label() { case "$1" in approve) echo "geen problemen gevonden";; partial) echo "⚠️ gedeeltelijk beoordeeld";; *) echo "$1";; esac; }
          lines="- DeepSeek: **$(label "$DEEPSEEK_STATUS")**"
          partial=false
          [ "$DEEPSEEK_STATUS" = "partial" ] && partial=true
          if [ "$QWEN_RAN" = "true" ]; then
            lines="$lines"$'\n'"- Qwen: **$(label "$QWEN_STATUS")**"
            [ "$QWEN_STATUS" = "partial" ] && partial=true
          fi
          rounds=$(gh api "repos/$REPO/pulls/$PR_NUMBER/commits" --paginate \
            --jq '[.[] | select(.commit.message | contains("[ai-fix]"))] | length' | awk '{s+=$1} END {print s+0}')
          if [ "$partial" = "true" ]; then
            title="⚠️ @$NOTIFY PR #$PR_NUMBER is klaar om te testen, maar de AI-review heeft niet alles gezien."
            extra="Kijk in de review-comments welke bestanden niet beoordeeld zijn, en test die extra goed (of splits de PR)."
          else
            title="✅ @$NOTIFY PR #$PR_NUMBER is klaar om te testen."
            extra="De AI-review is een extra paar ogen, geen keurmerk: jouw eigen test en de Quality-checks blijven de echte controle."
          fi
          printf '%s\n\n%s\n- Automatische fix-rondes door Claude: **%s**\n- Commit: `%s`\n\n%s\n' \
            "$title" "$lines" "$rounds" "${HEAD_SHA:0:7}" "$extra" > "$RUNNER_TEMP/body.md"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/body.md"
